[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-benchmark-lab"
version = "1.0.0"
description = "Reusable machine learning benchmarks for tabular datasets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "matplotlib==3.10.8",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
ml-benchmark = "ml_benchmark.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
